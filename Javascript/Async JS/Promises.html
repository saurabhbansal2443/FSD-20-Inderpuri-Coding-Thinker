    function CutTheBread(raw) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (raw) {
            resolve("Bread Is cutted");
          } else {
            reject("Cut the bread failed");
          }
        }, 2000);
      });
    }
    function addStuffings(bread) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (bread) {
            resolve("Bread is stuffed");
          } else {
            reject("Add stuffings failed");
          }
        }, 2000);
      });
    }

    function bake(bread) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (bread) {
            resolve("Sandwich is ready");
          } else {
            reject("Bake failed");
          }
        }, 2000);
      });
    }
